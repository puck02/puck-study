<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyFlow · 极简学习看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <style>
    @font-face {
      font-family: 'BaiLuQiaoLi';
      src: url('./assets/fonts/bailuqiaolishouxieti.ttf') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>
  <div class="app-shell figma-shell">
    <main class="figma-board">
      <section class="figma-stage">
        <div class="figma-bg"></div>
        <div class="figma-layout">
          <section class="left-column">
            <section class="quote-block">
              <p class="board-kicker">study planner</p>
              <h1 id="dailyQuote">不要温和地走进那个良夜</h1>
              <p id="dailyQuoteSource" class="quote-source handwriting-source">—— 狄兰·托马斯《不要温和地走进那个良夜》</p>
            </section>

            <section class="summary-section" aria-label="今日学习统计">
              <div class="summary-orb__pie-wrap">
                <div id="subjectPie" class="subject-pie figma-pie"></div>
                <div id="emptyStateText" class="empty-state-text">今天还没有学习记录</div>
              </div>
              <div class="summary-orb__stats" id="todaySummaryText">
                <p>合计: 4h40min</p>
                <p>数学: 2h</p>
                <p>403: 1h</p>
                <p>英语: 30min</p>
                <p>政治: 10min</p>
              </div>
            </section>

            <section class="segmented-wrap" aria-label="时间范围切换">
              <div class="segmented-control figma-segmented">
                <button class="active" data-heat-mode="today">今日</button>
                <button data-heat-mode="week">本周</button>
                <button data-heat-mode="month">本月</button>
                <button data-heat-mode="custom">自定义</button>
              </div>
            </section>

            <section class="font-probe" aria-label="字体对照验证">
              <p class="font-probe__label">font probe</p>
              <div class="font-probe__grid">
                <div class="font-probe__card">
                  <p class="font-probe__title">BaiLuQiaoLi</p>
                  <p class="font-probe__sample font-probe__sample--bailu">不要温和地走进那个良夜 今日 本周 本月 自定义 外刊一篇 李林讲尖高数第一章</p>
                </div>
                <div class="font-probe__card">
                  <p class="font-probe__title">System Fallback</p>
                  <p class="font-probe__sample font-probe__sample--fallback">不要温和地走进那个良夜 今日 本周 本月 自定义 外刊一篇 李林讲尖高数第一章</p>
                </div>
              </div>
            </section>
          </section>

          <section class="right-column">
            <section class="countdown-card" aria-label="考研倒计时">
              <div class="countdown-note">Last 211 Day!</div>
              <div class="countdown-value"><span id="countdownDays">211</span></div>
              <p class="countdown-subtitle" hidden>距 2027 考研初试</p>
            </section>

            <section class="task-note" aria-label="今日任务">
              <div class="task-note__pin task-note__pin--a"></div>
              <div class="task-note__pin task-note__pin--b"></div>
              <p class="task-note__label">today list</p>
              <div id="planList" class="task-list figma-task-list empty">暂无计划。</div>
            </section>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
